<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0908">
  <title>Hors connexion · Cards</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px;
      background: radial-gradient(60% 50% at 50% 40%, #173826 0%, #0c0908 75%);
      color: #f5efe3; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    main { max-width: 320px; }
    img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.5); }
    h1 { margin: 20px 0 6px; font: 700 24px/1.2 Georgia, "Times New Roman", serif; color: #f3d48f; }
    p { margin: 0 0 22px; color: rgb(245 239 227 / 0.7); }
    button {
      appearance: none; border: 1px solid #d9b26a; border-radius: 10px; padding: 12px 22px;
      background: linear-gradient(#f3d48f, #c99a4b); color: #24180a; font: 600 16px system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <h1>Pas de connexion</h1>
    <p>La table a besoin d’Internet pour retrouver vos amis. Vérifiez le réseau puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
  <script>window.addEventListener('online', () => location.reload())</script>
</body>
</html>
